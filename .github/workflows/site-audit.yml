name: Site Core Audit

on:
  pull_request:
  push:
    branches: [main, site-core-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SEO + content quality audit
        run: python scripts/site_audit.py
      - name: JavaScript syntax check
        run: |
          node --check assets/site-core.js
          node --check assets/health-assistant.js
          node --check cloudflare-worker/src/index.js
      - name: Assistant config check
        run: |
          python -m json.tool assets/assistant-config.json > /dev/null
      - name: Assistant routing regression
        run: python scripts/assistant_routing_test.py
