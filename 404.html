<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<meta name="color-scheme" content="dark">
<title>Sayfa bulunamadı · İhsan Eren</title>
<meta name="description" content="Aradığınız sayfa bulunamadı. Ana sayfaya veya Bilgi Köşesi'ne dönebilirsiniz.">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/assets/site-core.css">
<meta name="theme-color" content="#1c2819">
<style>
:root{--ground:#1c2819;--panel:#263723;--ink:#ece5cf;--muted:#9fab90;--foil:#d8b25e;--line:rgba(236,229,207,.14);--display:"Marcellus",Georgia,serif;--body:"Figtree","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,rgba(143,164,118,.16),transparent 48%),var(--ground);color:var(--ink);font-family:var(--body)}
main{width:min(680px,100%);padding:clamp(28px,7vw,54px);border:1px solid var(--line);border-radius:24px;background:rgba(38,55,35,.72);text-align:center}
.code{font-family:var(--display);font-size:clamp(72px,20vw,150px);line-height:.9;color:var(--foil)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,7vw,46px);margin:18px 0 10px}
p{color:var(--muted);font-size:17px;line-height:1.65;margin:0 auto 26px;max-width:48ch}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a{display:inline-flex;padding:11px 18px;border-radius:999px;text-decoration:none;font-weight:600;background:var(--foil);color:var(--ground)}
a.secondary{background:transparent;color:var(--ink);border:1px solid rgba(216,178,94,.55)}
.lang{margin-top:24px;font-size:14px}
.lang a{padding:0;background:none;color:var(--foil);font-weight:500}
</style>
</head>
<body>
<main>
  <div class="code" aria-hidden="true">404</div>
  <h1>Bu sayfa burada değil.</h1>
  <p>Bağlantı değişmiş veya sayfa taşınmış olabilir. Ana sayfaya dönebilir ya da sağlık rehberlerine göz atabilirsiniz.</p>
  <div class="actions">
    <a href="/">Ana sayfa</a>
    <a class="secondary" href="/bilgi.html">Bilgi Köşesi</a>
  </div>
  <div class="lang" lang="en">Looking for the English site? <a href="/en/">Go to English home →</a></div>
</main>
<script src="/assets/site-core.js" defer></script>
</body>
</html>
